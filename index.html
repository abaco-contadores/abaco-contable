<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ábaco</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0A0A0A">
<style>
:root{--bg:#0A0A0A;--c1:#141414;--c2:#1c1c1c;--gold:#C2A97F;--gr:#D9D9D9;--mut:#8d8a84;--ok:#8fb996;--bad:#d98b7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--gr);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.n{font-family:"Iowan Old Style",Georgia,serif;font-weight:600;color:#fff;margin:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c1);border-top:1px solid #2a2a2a;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:14px 4px;font:inherit;font-size:13px}
nav button.on{color:var(--gold);box-shadow:inset 0 2px var(--gold)}
main{padding:18px 16px 96px;max-width:760px;margin:0 auto}
.card{background:var(--c1);border:1px solid #262626;border-radius:14px;padding:14px;margin:10px 0}
.card.click{cursor:pointer}.card.click:active{background:var(--c2)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{color:var(--mut);font-size:12.5px}.n{font-size:22px}.gold{color:var(--gold)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
button.b,dialog button{background:var(--gold);color:#0A0A0A;border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;min-height:44px}
button.g{background:none;border:1px solid #3a3a3a;color:var(--gr);border-radius:10px;padding:9px 12px;font:inherit;min-height:40px}
button.s{padding:7px 10px;min-height:36px;font-size:13px}
.bar{height:8px;background:#2a2a2a;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--gold)}
.tag{font-size:12px;border:1px solid #3a3a3a;border-radius:20px;padding:2px 9px;color:var(--mut)}
.tag.v{color:var(--bad);border-color:var(--bad)}.tag.p{color:var(--ok);border-color:var(--ok)}
dialog{background:var(--c1);color:var(--gr);border:1px solid #333;border-radius:16px;width:min(420px,92vw);padding:18px}
dialog::backdrop{background:#000a}label{display:block;margin:10px 0;font-size:13px;color:var(--mut)}
input{width:100%;margin-top:4px;background:var(--bg);color:#fff;border:1px solid #333;border-radius:10px;padding:11px;font:inherit}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid #2a2a2a}td:last-child,th:last-child{text-align:right}
#st{position:fixed;inset:0;background:#fff;color:#0A0A0A;overflow:auto;padding:28px;z-index:9}
#st h1,#st h3{color:#0A0A0A}#st th{border-bottom:2px solid var(--gold)}#st td{border-color:#ddd}
@media(min-width:800px){nav{top:0;bottom:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid #2a2a2a;padding-top:30px}nav button{text-align:left;padding:14px 22px}nav button.on{box-shadow:inset 3px 0 var(--gold)}main{margin-left:220px;padding-bottom:40px}}
@media print{body>*:not(#st){display:none!important}#st{position:static}.np{display:none}}
.ln{display:grid;grid-template-columns:1fr 88px 88px;gap:6px;margin:6px 0}.ln input{margin:0;padding:10px 8px}dialog.wide{width:min(640px,96vw);max-height:92vh;overflow:auto}.sc{overflow-x:auto}.sc table{min-width:520px}input.q{margin:8px 0}select{width:100%;background:var(--bg);color:#fff;border:1px solid #333;border-radius:10px;padding:11px;font:inherit}.ind{display:block}</style></head><body>
<main id="m"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script>
const sb=supabase.createClient('https://eqlbssgdipitcoqtejpi.supabase.co','sb_publishable__iDo09pX5WLH4GU1qrGKzQ_ZLp2uc8p'),$m=document.getElementById('m'),g=i=>document.getElementById(i);
function hub(u){$m.innerHTML=`<div style="text-align:center;margin:10px 0 18px"><img src="icon-192.png" alt="Ábaco" style="width:92px;height:92px;border-radius:22px"><h1 style="margin-top:12px">Ábaco</h1><p class="k">${u.email}</p></div>
<div class="card click" onclick="location.href='contabilidad.html'"><h2 class="gold">Contabilidad</h2><p class="k">Libro diario, libro mayor, balance de comprobación y plan de cuentas.</p></div>
<div class="card click" onclick="location.href='cxc-cxp.html'"><h2 class="gold">CxC y CxP</h2><p class="k">Cuentas por cobrar, cuentas por pagar y financiamientos, con estados de cuenta.</p></div>
<div class="card click" onclick="location.href='inventario.html'"><h2 class="gold">Inventario</h2><p class="k">Productos, compras, notas de entrega, kardex, costo promedio y reportes.</p></div>
<div class="acts"><button class="g s" onclick="out()">Cerrar sesión</button></div>`}
function login(msg){$m.innerHTML=`<div style="text-align:center;margin:10px 0 18px"><img src="icon-192.png" alt="Ábaco" style="width:92px;height:92px;border-radius:22px"><h1 style="margin-top:12px">Ábaco</h1></div><div class="card"><label>Correo<input id="em" type="email" autocomplete="email"></label><label>Contraseña (mínimo 6 caracteres)<input id="pw" type="password" autocomplete="current-password"></label><p class="bad" id="lm">${msg||''}</p><div class="acts"><button class="b" onclick="auth('in')">Entrar</button><button class="g" onclick="auth('up')">Crear cuenta</button></div></div>`}
async function auth(m){const email=g('em').value.trim(),password=g('pw').value;g('lm').textContent='Un momento…';const r=m=='in'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
 if(r.error){g('lm').textContent=r.error.message;return}if(!r.data.session){g('lm').textContent='Revisa tu correo para confirmar la cuenta y luego pulsa Entrar.';return}hub(r.data.session.user)}
async function out(){await sb.auth.signOut();login()}
sb.auth.getSession().then(({data})=>data.session?hub(data.session.user):login());
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
